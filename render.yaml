services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Tell Render to use GET /health for its health check — avoids HEAD /
    # returning 405 which causes Render to restart the service mid-indexing.
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: studymate
      - key: FRONTEND_URL
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_UPLOAD_MB
        value: "10"
