services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    # Build step:
    # 1. Install dependencies (fastembed pulls ONNX Runtime, ~50 MB)
    # 2. Pre-download the fastembed ONNX model at BUILD time so it is
    #    cached in the container image and never downloaded at request time.
    #    This prevents OOM/timeout during the first upload on a cold start.
    buildCommand: >
      pip install -r requirements.txt &&
      python -c "from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5'); print('fastembed model cached')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Tell Render to use GET /health for its health check.
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: studymate
      - key: FRONTEND_URL
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_UPLOAD_MB
        value: "10"
