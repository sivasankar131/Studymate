services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    # fastembed uses ONNX Runtime — no torch, no CUDA, no pre-install needed.
    # pip install -r requirements.txt is sufficient.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: studymate
      - key: FRONTEND_URL
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_UPLOAD_MB
        value: "10"
