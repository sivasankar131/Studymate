services:
  - type: web
    name: studymate-api
    runtime: python
    rootDir: backend
    # Install torch CPU-only wheel first (saves ~2 GB vs the default CUDA wheel),
    # then install the rest of the project dependencies.
    buildCommand: >
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: studymate
      - key: FRONTEND_URL
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_UPLOAD_MB
        value: "10"
