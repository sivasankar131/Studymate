<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- background -->
  <rect width="32" height="32" rx="8" fill="#0d9488"/>
  <!-- bottom page shadow -->
  <rect x="6" y="19" width="18" height="2" rx="1" fill="#99f6e4" opacity="0.4"/>
  <!-- middle page -->
  <rect x="5" y="14" width="18" height="9" rx="2" fill="#ccfbf1"/>
  <!-- top page -->
  <rect x="7" y="8" width="18" height="10" rx="2" fill="white"/>
  <!-- lines on top page -->
  <line x1="10" y1="12" x2="22" y2="12" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="15" x2="19" y2="15" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
  <!-- spark top-right -->
  <circle cx="24" cy="8" r="2.5" fill="#f0fdfa"/>
  <line x1="24" y1="5" x2="24" y2="4"   stroke="#f0fdfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="24" y1="11" x2="24" y2="12" stroke="#f0fdfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="21" y1="8" x2="20" y2="8"   stroke="#f0fdfa" stroke-width="1" stroke-linecap="round"/>
  <line x1="27" y1="8" x2="28" y2="8"   stroke="#f0fdfa" stroke-width="1" stroke-linecap="round"/>
</svg>
